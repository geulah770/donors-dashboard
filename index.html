<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דשבורד תורמי הדינר</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app. Gate screen before sign-in, then a header with headline numbers, segmented tabs (list / summaries), filter bar, donor cards that open a bottom-sheet editor. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f5f7fb; --ink:#14213d; --muted:#5b6784; --line:#dbe1ec;
  --accent:#1f4fd8; --accent-ink:#ffffff; --accent-soft:#e3eaff;
  --ok:#1b7f4f; --ok-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fdefd2; --crit:#b3261e; --crit-soft:#fbe1de; --info:#1f4fd8; --info-soft:#e3eaff; --neutral:#56607a; --neutral-soft:#e8ebf2;
  --shadow:0 8px 28px rgba(20,33,61,.18);
  --font-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-display:"Frank Ruhl Libre","Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d1424; --surface:#162038; --surface2:#1c2845; --ink:#eaf0ff; --muted:#9aa8c9; --line:#2a3858;
  --accent:#6b93ff; --accent-ink:#0d1424; --accent-soft:#22325f;
  --ok:#5fd29b; --ok-soft:#173a2b; --warn:#f0b75a; --warn-soft:#3d2f14; --crit:#ff8e86; --crit-soft:#432022; --info:#8fb0ff; --info-soft:#22325f; --neutral:#a7b2cf; --neutral-soft:#26334f;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto}

header.top{padding-block:16px 6px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.right{display:flex;align-items:center;gap:10px}
.sync{font-size:13px;color:var(--muted);white-space:nowrap}
.sync b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-inline-start:6px}
.sync.live b{background:var(--ok)}
.out{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:14px;min-height:36px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi.hero{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:transparent}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi.hero .lbl{color:inherit;opacity:.75}
.kpi .val{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.kpi.hero .val{font-size:34px}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:2px}
.kpi.hero .sub{color:inherit;opacity:.75}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--neutral-soft);margin-top:12px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend em{width:9px;height:9px;border-radius:3px;display:inline-block}

.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-top:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
.tabs button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted);min-height:44px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.filters{display:grid;gap:10px;margin-top:14px}
.search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:48px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;display:inline-flex;gap:6px;align-items:center}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.selrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
select,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px}
.resultline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-top:12px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 4px;min-height:40px}

.list{display:grid;gap:10px;margin-top:8px}
.card{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.card:active{background:var(--surface2)}
.card .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.card .amt{font-family:var(--font-display);font-weight:700;font-size:19px;white-space:nowrap}
.card .r2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.card .r3{margin-top:8px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.card .note{margin-top:6px;font-size:14px;background:var(--surface2);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--neutral-soft);color:var(--neutral)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.title{background:var(--accent-soft);color:var(--accent)}

.empty{text-align:center;color:var(--muted);padding:36px 16px;border:1px dashed var(--line);border-radius:14px;margin-top:14px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sec h2{font-size:16px;margin:0 0 10px;font-weight:700}
.sec .hint{font-size:13px;color:var(--muted);margin:-6px 0 10px}
.brow{display:grid;grid-template-columns:minmax(78px,32%) 1fr auto;gap:10px;align-items:center;padding:7px 0;border:0;border-top:1px solid var(--line);font-size:14.5px;width:100%;background:none;text-align:start}
.brow:first-of-type{border-top:0}
.brow .bn{overflow-wrap:anywhere;font-weight:600}
.brow .bar{height:12px;border-radius:6px;background:var(--neutral-soft);overflow:hidden;display:flex}
.brow .bar i{display:block;height:100%}
.brow .bv{text-align:end;white-space:nowrap}
.brow .bv small{display:block;color:var(--muted);font-size:12px}
.tools{display:grid;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn:disabled{opacity:.55;cursor:default}

.fab{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:0 20px;min-height:54px;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab span{font-size:24px;line-height:1}

.scrim{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.sheet h3{margin:0 0 12px;font-family:var(--font-display);font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field textarea{min-height:70px;resize:vertical}
.sheetbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sheetbtns .full{grid-column:1/-1}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;text-align:center;box-shadow:var(--shadow)}
.ro{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:10px;margin-top:12px}

/* sign-in gate */
.gate{max-width:460px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;box-shadow:var(--shadow)}
.gate h1{font-size:28px}
.gate p{color:var(--muted);margin:10px 0 0}
.gate .must{margin-top:16px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600}
.gate .btn{width:100%;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px}
.gate .small{font-size:13px;margin-top:14px}
.gate .err{margin-top:14px;background:var(--crit-soft);color:var(--crit);border-radius:12px;padding:10px 14px;font-size:14.5px}
.setup{max-width:560px;margin:8vh auto 0;background:var(--surface);border:2px dashed var(--warn);border-radius:18px;padding:20px}
.setup code{background:var(--surface2);padding:2px 6px;border-radius:6px;direction:ltr;unicode-bidi:embed}
@media (max-width:380px){.selrow{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.card,.chip,.btn{transition:background .15s}}
</style>
</head>
<body>

<!--
  ===== הגדרה חד־פעמית (לראות גם את ההוראות בהודעה שמלווה את הקובץ) =====
  1. ב-Google Cloud Console: להפעיל את Google Sheets API.
  2. ליצור OAuth Client ID מסוג Web application, ולהוסיף ל-Authorized JavaScript origins את כתובת האתר שמארח את הקובץ.
  3. להדביק את ה-Client ID בשדה CLIENT_ID בתחילת הסקריפט למטה.
  4. לשתף את הגיליון (כעורכים) עם חברי הצוות. ההרשאות נקבעות בגוגל, לא בדף.
-->

<div id="gate" hidden></div>

<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="title-row">
      <h1>תורמי הדינר</h1>
      <div class="right">
        <div class="sync" id="sync">טוען<b></b></div>
        <button class="out" id="signout" type="button">התנתקות</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </header>
  <div class="tabs" role="tablist" aria-label="תצוגה">
    <button role="tab" aria-selected="true" data-tab="list">רשימה</button>
    <button role="tab" aria-selected="false" data-tab="sum">סיכומים</button>
  </div>
  <main id="view"></main>
  <button class="fab" id="fab" type="button" aria-label="הוספת תורם"><span>+</span> תורם חדש</button>
</div>
<div id="layer"></div>

<script>
(function(){
"use strict";

/* ============ הגדרות ============ */
var CFG={
  CLIENT_ID:"YOUR_CLIENT_ID.apps.googleusercontent.com",   // <-- להחליף ב-Client ID של Google
  SHEET_ID:"1_o5503CxiAaiV4xkIQS6q8ao4Lb9P4K_f_vdlQiGk3c",  // הגיליון "תורמים בדינר ואחכ"
  TAB:"גיליון1",
  SCOPE:"https://www.googleapis.com/auth/spreadsheets"
};

var STATUSES=["בוצע","מזומן","בתהליך","נשלח לינק","לטיפול","לא ידוע פרטי קשר"];
var CLOSED={"בוצע":1,"מזומן":1};
var STATUS_CLS={"בוצע":"ok","מזומן":"ok","בתהליך":"info","נשלח לינק":"warn","לטיפול":"crit","לא ידוע פרטי קשר":""};
var STATUS_COLOR={"בוצע":"var(--ok)","מזומן":"var(--info)","בתהליך":"var(--accent)","נשלח לינק":"var(--warn)","לטיפול":"var(--crit)","לא ידוע פרטי קשר":"var(--neutral)"};
var SORTS={ord:"סדר בגיליון",total:"סכום (מהגבוה)",name:"שם",status:"סטטוס"};
var RANGE="'"+CFG.TAB+"'!A1:L1000";

var rows=[], loaded=false, token=null, tokenExp=0, tokenClient=null, readOnly=false, pollTimer=null, busyLoad=false;
var st={tab:"list",q:"",status:"",handler:"",title:"",sort:"ord"};

function $(s,r){return (r||document).querySelector(s)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function fmt(n){return new Intl.NumberFormat("he-IL",{maximumFractionDigits:0}).format(Math.round(n||0))}
function shekel(n){return "₪"+fmt(n)}
function num(v){var n=parseFloat(String(v).replace(/[^\d.\-]/g,""));return isFinite(n)?n:0}
function fullName(r){return ((r.first||"")+" "+(r.last||"")).trim()||"ללא שם"}
function toast(msg){var old=$(".toast");if(old)old.remove();var t=el("div","toast",msg);t.setAttribute("role","status");document.body.appendChild(t);setTimeout(function(){t.remove()},3200)}
function uniq(key){var m={};rows.forEach(function(r){var v=(r[key]||"").trim();if(v)m[v]=(m[v]||0)+1});return Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b,"he")})}

/* ============ Google Sheets API ============ */
function apiErr(status,body){
  var msg=(body&&body.error&&body.error.message)||"";
  var e=new Error(msg||("HTTP "+status));e.status=status;e.apiMessage=msg;return e}
function api(path,opts,retried){
  opts=opts||{};
  var pre=(token&&Date.now()>tokenExp&&!retried)?refreshToken():Promise.resolve();
  return pre.then(function(){
  var headers={"Authorization":"Bearer "+token};
  if(opts.body)headers["Content-Type"]="application/json";
  return fetch("https://sheets.googleapis.com/v4/spreadsheets/"+CFG.SHEET_ID+path,{method:opts.method||"GET",headers:headers,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(r){
      return r.json().catch(function(){return null}).then(function(j){
        if(r.ok)return j;
        if(r.status===401&&!retried){return refreshToken().then(function(){return api(path,opts,true)})}
        throw apiErr(r.status,j)})})})}
function enc(s){return encodeURIComponent(s)}
function getValues(range){return api("/values/"+enc(range)).then(function(j){return (j&&j.values)||[]})}

/* ============ התחברות ============ */
function configured(){return CFG.CLIENT_ID&&CFG.CLIENT_ID.indexOf("YOUR_CLIENT_ID")!==0}
function fetchToken(){
  return fetch("/api/auth/token",{headers:{"X-Requested-With":"dashboard"},cache:"no-store",credentials:"same-origin"}).then(function(r){
    if(r.status===401){var e=new Error("no_session");e.auth=true;throw e}
    if(!r.ok)throw new Error("token_"+r.status);
    return r.json()}).then(function(j){token=j.access_token;tokenExp=Date.now()+(j.expires_in||3600)*1000-120000;return token})}
function refreshToken(){return fetchToken()}

function showGate(opts){
  opts=opts||{};
  stopPolling();
  $("#app").hidden=true;$("#layer").textContent="";
  var g=$("#gate");g.hidden=false;g.textContent="";
  if(!configured()){
    var s=el("div","setup");
    s.appendChild(el("h1",null,"חסרה הגדרה אחת"));
    var p=el("p");p.appendChild(document.createTextNode("הדף עדיין לא מחובר ל-Google. יש להדביק Client ID בשדה "));
    p.appendChild(el("code",null,"CLIENT_ID"));p.appendChild(document.createTextNode(" בתחילת הסקריפט בקובץ."));s.appendChild(p);
    g.appendChild(s);return}
  var box=el("div","gate");
  box.appendChild(el("h1",null,"תורמי הדינר"));
  box.appendChild(el("p",null,"הנתונים נשמרים בגיליון בגוגל ומוצגים רק אחרי התחברות."));
  box.appendChild(el("div","must","כדי להיכנס צריך להתחבר עם חשבון Google שיש לו הרשאת כתיבה (עריכה) בגיליון התורמים."));
  if(opts.error)box.appendChild(el("div","err",opts.error));
  var b2=el("button","btn primary","התחברות עם Google");b2.type="button";
  b2.onclick=signInRedirect;box.appendChild(b2);
  box.appendChild(el("p","small","אין הרשאה? בקשו מבעל הגיליון להוסיף את החשבון שלכם כעורך."));
  g.appendChild(box)}

function signInRedirect(){location.href="/api/auth/login"}
var AUTH_ERRORS={access_denied:"ההתחברות בוטלה או שהחשבון לא נמצא ברשימת Test users.",missing_scope:"צריך לאשר את הגישה לגיליונות Google כדי להיכנס.",state:"ההתחברות לא אומתה. נסו שוב.",no_refresh_token:"גוגל לא החזירה אישור התחברות ממושך. נסו שוב.",invalid_client:"הגדרות ה-Client בשרת שגויות (בדקו GOOGLE_CLIENT_SECRET).",redirect_uri_mismatch:"הכתובת /api/auth/callback לא רשומה ב-Authorized redirect URIs."};
function urlError(){
  var e=new URLSearchParams(location.search).get("autherror");if(!e)return null;
  try{history.replaceState(null,"",location.pathname)}catch(x){}
  return AUTH_ERRORS[e]||("גוגל החזירה שגיאה: "+e)}

function signOut(){
  token=null;rows=[];loaded=false;readOnly=false;stopPolling();
  fetch("/api/auth/logout",{method:"POST",headers:{"X-Requested-With":"dashboard"},credentials:"same-origin"}).catch(function(){}).then(function(){showGate()})}

/* ============ טעינה וסנכרון ============ */
function parse(values){
  var out=[];
  for(var i=1;i<values.length;i++){
    var v=values[i]||[],c=[],any=false;
    for(var k=0;k<12;k++){var x=v[k]==null?"":String(v[k]);c.push(x);if(x.trim())any=true}
    if(!any)continue;
    out.push({ord:i+1,sig:c.join("\u0001"),first:c[0].trim(),last:c[1].trim(),phone:c[2].trim(),title:c[3].trim(),monthly:num(c[4]),months:num(c[5]),total:num(c[6]),dedication:c[7].trim(),method:c[8].trim(),status:c[9].trim(),handler:c[10].trim(),notes:c[11].trim()})}
  return out}
function sigOf(v){var c=[];v=v||[];for(var k=0;k<12;k++)c.push(v[k]==null?"":String(v[k]));return c.join("\u0001")}

function loadAll(first){
  if(busyLoad)return Promise.resolve();busyLoad=true;
  setSync(false,"טוען");
  return getValues(RANGE).then(function(values){
    busyLoad=false;rows=parse(values);loaded=true;
    $("#gate").hidden=true;$("#app").hidden=false;
    setSync(true,"מסונכרן עם הגיליון");
    var open=document.activeElement&&document.activeElement.id==="q";var pos=open?document.activeElement.selectionStart:0;
    if(first||!$("#layer").firstChild)render();else renderKpis();
    if(open){var qi=$("#q");if(qi){qi.focus();try{qi.setSelectionRange(pos,pos)}catch(e){}}}
    startPolling()
  }).catch(function(e){busyLoad=false;throw e}).catch(handleLoadError)}

function handleLoadError(e){
  var s=e&&e.status;
  if(e&&e.auth){showGate({error:"החיבור פג. התחברו שוב."});return}
  if(s===401){showGate({error:"החיבור פג. התחברו שוב."});return}
  if(s===403||s===404){showGate({error:"לחשבון הזה אין גישה לגיליון התורמים. התחברו עם חשבון אחר או בקשו הרשאה מבעל הגיליון."});return}
  if(s===400){showGate({error:"לא נמצאה הלשונית \""+CFG.TAB+"\" בגיליון."});return}
  if(loaded){setSync(false,"העדכון האחרון נכשל");return}
  showGate({error:"אי אפשר לטעון את הגיליון כרגע. נסו שוב בעוד רגע."})}

function startPolling(){stopPolling();pollTimer=setInterval(function(){if(!document.hidden&&!$("#layer").firstChild&&token)loadAll(false)},60000)}
function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&token&&loaded&&!$("#layer").firstChild)loadAll(false)});

function setSync(ok,txt){var s=$("#sync");s.className="sync"+(ok?" live":"");s.textContent=txt;s.appendChild(el("b"))}

/* ============ כתיבה לגיליון ============ */
function cell(n){return n?n:""}
function rowOf(d){return [d.first,d.last,d.phone,d.title,cell(d.monthly),cell(d.months),cell(d.total),d.dedication,d.method,d.status,d.handler,d.notes]}
function staleErr(){var e=new Error("stale");e.stale=true;return e}
function checkRow(r){
  var rng="'"+CFG.TAB+"'!A"+r.ord+":L"+r.ord;
  return getValues(rng).then(function(v){if(sigOf(v[0])!==r.sig)throw staleErr();return rng})}
function writeDonor(r,d){
  if(!r){
    return api("/values/"+enc("'"+CFG.TAB+"'!A1")+":append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",{method:"POST",body:{values:[rowOf(d)]}})}
  return checkRow(r).then(function(rng){
    return api("/values/"+enc(rng)+"?valueInputOption=RAW",{method:"PUT",body:{range:rng,majorDimension:"ROWS",values:[rowOf(d)]}})})}
function clearDonor(r){
  return checkRow(r).then(function(rng){return api("/values:batchClear",{method:"POST",body:{ranges:[rng]}})})}
function writeErr(e){
  if(e&&e.status===403){readOnly=true;return "לחשבון הזה אין הרשאת כתיבה בגיליון"}
  if(e&&e.auth)return "החיבור פג. התחברו מחדש";
  if(e&&e.status===401)return "החיבור פג. התחברו מחדש";
  return "לא ברור אם השינוי נשמר. בדקו בגיליון לפני שמנסים שוב"}

/* ============ סינון וסיכומים ============ */
function filtered(){
  var q=st.q.trim();
  var out=rows.filter(function(r){
    if(st.status&&r.status!==st.status)return false;
    if(st.handler&&r.handler!==st.handler)return false;
    if(st.title&&r.title!==st.title)return false;
    if(q){var hay=[r.first,r.last,r.phone,r.title,r.method,r.notes,r.handler,r.dedication].join(" ");if(hay.indexOf(q)<0)return false}
    return true});
  var s=st.sort;
  out.sort(function(a,b){
    if(s==="total")return b.total-a.total;
    if(s==="name")return fullName(a).localeCompare(fullName(b),"he");
    if(s==="status")return STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status)||a.ord-b.ord;
    return a.ord-b.ord});
  return out}
function sums(list){
  var t={n:list.length,total:0,closed:0,open:0,closedN:0};
  list.forEach(function(r){var v=r.total;t.total+=v;if(CLOSED[r.status]){t.closed+=v;t.closedN++}else t.open+=v});
  return t}

function renderKpis(){
  var box=$("#kpis");box.textContent="";
  var all=sums(rows), filteredOn=!!(st.q||st.status||st.handler||st.title);
  var list=filteredOn?filtered():rows, t=filteredOn?sums(list):all;
  var hero=el("div","kpi hero");
  hero.appendChild(el("div","lbl",filteredOn?"סך התחייבויות בסינון הנוכחי":"סך כל ההתחייבויות"));
  hero.appendChild(el("div","val num",shekel(t.total)));
  hero.appendChild(el("div","sub num",fmt(t.n)+" תורמים"+(filteredOn?" מתוך "+fmt(all.n):"")));
  var stack=el("div","stack");stack.setAttribute("aria-hidden","true");
  var by={};STATUSES.forEach(function(s){by[s]=0});
  list.forEach(function(r){var k=by.hasOwnProperty(r.status)?r.status:"לא ידוע פרטי קשר";by[k]+=r.total});
  if(t.total>0)STATUSES.forEach(function(s){if(by[s]>0){var i=el("i");i.style.width=(by[s]/t.total*100)+"%";i.style.background=STATUS_COLOR[s];stack.appendChild(i)}});
  hero.appendChild(stack);
  var lg=el("div","legend");
  STATUSES.forEach(function(s){if(by[s]>0){var sp=el("span");var em=el("em");em.style.background=STATUS_COLOR[s];sp.appendChild(em);sp.appendChild(document.createTextNode(s));lg.appendChild(sp)}});
  hero.appendChild(lg);box.appendChild(hero);
  var k1=el("div","kpi");k1.appendChild(el("div","lbl","נסגר (בוצע + מזומן)"));k1.appendChild(el("div","val num",shekel(t.closed)));
  k1.appendChild(el("div","sub num",fmt(t.closedN)+" תורמים · "+(t.total?Math.round(t.closed/t.total*100):0)+"%"));
  var k2=el("div","kpi");k2.appendChild(el("div","lbl","עדיין פתוח"));k2.appendChild(el("div","val num",shekel(t.open)));
  k2.appendChild(el("div","sub num",fmt(t.n-t.closedN)+" תורמים בטיפול"));
  box.appendChild(k1);box.appendChild(k2)}

/* ============ רשימה ============ */
function chip(label,count,pressed,onclick){
  var b=el("button","chip");b.type="button";b.setAttribute("aria-pressed",pressed?"true":"false");
  b.appendChild(document.createTextNode(label));if(count!=null)b.appendChild(el("small",null,fmt(count)));
  b.onclick=onclick;return b}
function select(id,label,opts,val,onchange){
  var s=el("select");s.id=id;s.setAttribute("aria-label",label);
  var o0=el("option",null,label);o0.value="";s.appendChild(o0);
  opts.forEach(function(o){var op=el("option",null,o);op.value=o;s.appendChild(op)});
  s.value=val;s.onchange=function(){onchange(s.value)};return s}
function renderList(host){
  var f=el("div","filters");
  var sw=el("div","search");var inp=el("input");inp.id="q";inp.type="search";inp.placeholder="חיפוש לפי שם, טלפון, הערה…";inp.value=st.q;inp.setAttribute("aria-label","חיפוש");

  var chips=el("div","chips");

  STATUSES.forEach(function(s){var c=rows.filter(function(r){return r.status===s}).length;if(c||st.status===s)chips.appendChild(chip(s,c,st.status===s,function(){st.status=st.status===s?"":s;render()}))});
  f.appendChild(chips);
  var sr=el("div","selrow");
  sr.appendChild(select("fh","מטפל",uniq("handler"),st.handler,function(v){st.handler=v;render()}));
  sr.appendChild(select("ft","כותרת",uniq("title"),st.title,function(v){st.title=v;render()}));
  var so=el("select");so.id="fs";so.setAttribute("aria-label","מיון");
  Object.keys(SORTS).forEach(function(k){var o=el("option",null,SORTS[k]);o.value=k;so.appendChild(o)});so.value=st.sort;so.onchange=function(){st.sort=so.value;renderResults()};
  sr.appendChild(so);f.appendChild(sr);host.appendChild(f);
  var rl=el("div","resultline");rl.id="rl";host.appendChild(rl);
  var l=el("div","list");l.id="cards";host.appendChild(l);

function renderResults(){
  var l=$("#cards"),rl=$("#rl");if(!l)return;
  var list=filtered();l.textContent="";rl.textContent="";
  rl.appendChild(el("span","num",fmt(list.length)+" תורמים · "+shekel(sums(list).total)));
  if(st.q||st.status||st.handler||st.title){var cl=el("button","linkbtn","ניקוי סינון");cl.type="button";cl.onclick=function(){st.q=st.status=st.handler=st.title="";render()};rl.appendChild(cl)}
  if(!rows.length){var e2=el("div","empty");e2.appendChild(el("b",null,"הרשימה ריקה"));e2.appendChild(document.createTextNode("לחצו על \"תורם חדש\" כדי להוסיף את התורם הראשון."));l.appendChild(e2);return}
  if(!list.length){var e3=el("div","empty");e3.appendChild(el("b",null,"אין תוצאות"));e3.appendChild(document.createTextNode("נסו לשנות או לנקות את הסינון."));l.appendChild(e3);return}
  list.forEach(function(r){l.appendChild(card(r))})}
function card(r){
  var b=el("button","card");b.type="button";b.onclick=function(){openEditor(r)};
  var r1=el("div","r1");r1.appendChild(el("div","name",fullName(r)));r1.appendChild(el("div","amt num",shekel(r.total)));b.appendChild(r1);
  var r2=el("div","r2");r2.appendChild(el("span","pill "+(STATUS_CLS[r.status]||""),r.status||"ללא סטטוס"));
  if(r.title)r2.appendChild(el("span","pill title",r.title));b.appendChild(r2);
  var r3=el("div","r3");
  if(r.monthly&&r.months>1)r3.appendChild(el("span","num",shekel(r.monthly)+" × "+fmt(r.months)+" חודשים"));
  else if(r.monthly)r3.appendChild(el("span","num","תרומה חד־פעמית"));
  if(r.handler)r3.appendChild(el("span",null,"מטפל: "+r.handler));
  if(r.method)r3.appendChild(el("span",null,r.method));
  if(r3.childNodes.length)b.appendChild(r3);
  if(r.dedication)b.appendChild(el("div","note","הקדשה: "+r.dedication));
  if(r.notes)b.appendChild(el("div","note",r.notes));

/* ============ סיכומים ============ */
function groupBy(key,fallback){
  var m={};rows.forEach(function(r){var k=(r[key]||"").trim()||fallback;var g=m[k]||(m[k]={name:k,n:0,total:0,closed:0});g.n++;g.total+=r.total;if(CLOSED[r.status])g.closed+=r.total});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.total-a.total})}
function section(title,hint,groups,onpick){
  var s=el("section","sec");s.appendChild(el("h2",null,title));if(hint)s.appendChild(el("div","hint",hint));
  var max=0;groups.forEach(function(g){if(g.total>max)max=g.total});
  groups.forEach(function(g){
    var b=el("button","brow");b.type="button";b.onclick=function(){onpick(g.name)};
    b.appendChild(el("span","bn",g.name));
    var bar=el("span","bar");bar.setAttribute("aria-hidden","true");
    var w=max?g.total/max*100:0;
    var ci=el("i");ci.style.width=(g.total?w*g.closed/g.total:0)+"%";ci.style.background="var(--ok)";
    var oi=el("i");oi.style.width=(g.total?w*(g.total-g.closed)/g.total:0)+"%";oi.style.background="var(--warn)";
    bar.appendChild(ci);bar.appendChild(oi);b.appendChild(bar);
    var v=el("span","bv num",shekel(g.total));v.appendChild(el("small",null,fmt(g.n)+" · "+(g.total?Math.round(g.closed/g.total*100):0)+"% נסגר"));b.appendChild(v);
    s.appendChild(b)});
  return s}
function renderSummary(host){
  if(!rows.length){var e=el("div","empty");e.appendChild(el("b",null,"אין עדיין נתונים לסכם"));e.appendChild(document.createTextNode("הוסיפו תורמים ברשימה והסיכומים יופיעו כאן."));host.appendChild(e);return}
  var legend=el("div","legend");legend.style.marginTop="12px";
  [["var(--ok)","נסגר"],["var(--warn)","פתוח"]].forEach(function(p){var sp=el("span");var em=el("em");em.style.background=p[0];sp.appendChild(em);sp.appendChild(document.createTextNode(p[1]));legend.appendChild(sp)});
  host.appendChild(legend);
  var byStatus=STATUSES.map(function(s){var g={name:s,n:0,total:0,closed:0};rows.forEach(function(r){if(r.status===s){g.n++;g.total+=r.total;if(CLOSED[s])g.closed+=r.total}});return g}).filter(function(g){return g.n});
  host.appendChild(section("לפי סטטוס","לחיצה על שורה פותחת את הרשימה מסוננת",byStatus,function(n){st.status=n;st.handler=st.title="";st.q="";go("list")}));
  host.appendChild(section("לפי מטפל","כמה כל מטפל אחראי עליו וכמה מזה כבר נסגר",groupBy("handler","ללא מטפל"),function(n){st.handler=n==="ללא מטפל"?"":n;st.status=st.title=st.q="";go("list")}));
  host.appendChild(section("לפי כותרת תרומה",null,groupBy("title","ללא כותרת"),function(n){st.title=n==="ללא כותרת"?"":n;st.status=st.handler=st.q="";go("list")}));
  var tools=el("div","tools");
  var ex=el("button","btn","ייצוא הרשימה לקובץ CSV");ex.type="button";ex.onclick=exportCsv;tools.appendChild(ex);host.appendChild(tools)}

/* ============ עריכה ============ */
function field(id,label,val,type,extra){
  var w=el("div","field");var l=el("label",null,label);l.htmlFor=id;w.appendChild(l);
  var i=type==="textarea"?el("textarea"):el("input");i.id=id;if(type&&type!=="textarea")i.type=type;
  if(type==="number"){i.inputMode="decimal";i.min="0"}
  i.value=val==null?"":val;if(extra)Object.keys(extra).forEach(function(k){i.setAttribute(k,extra[k])});
  w.appendChild(i);return w}
function openEditor(r){
  var isNew=!r;r=r||{first:"",last:"",phone:"",title:"",monthly:0,months:0,total:0,dedication:"",method:"",status:"לטיפול",handler:"",notes:""};
  var layer=$("#layer");layer.textContent="";
  var scrim=el("div","scrim");var sh=el("div","sheet");sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-label",isNew?"תורם חדש":"עריכת תורם");
  scrim.onclick=function(e){if(e.target===scrim)close()};
  sh.appendChild(el("h3",null,isNew?"תורם חדש":fullName(r)));
  var g=el("div","grid2");g.appendChild(field("e-first","שם פרטי",r.first,"text"));g.appendChild(field("e-last","שם משפחה",r.last,"text"));sh.appendChild(g);
  sh.appendChild(field("e-phone","טלפון",r.phone,"tel"));
  var sf=el("div","field");var sl=el("label",null,"סטטוס");sl.htmlFor="e-status";sf.appendChild(sl);
  var ss=el("select");ss.id="e-status";var list=STATUSES.slice();if(r.status&&list.indexOf(r.status)<0)list.push(r.status);
  list.forEach(function(s){var o=el("option",null,s);o.value=s;ss.appendChild(o)});ss.value=r.status||"לטיפול";sf.appendChild(ss);sh.appendChild(sf);
  var g2=el("div","grid2");
  g2.appendChild(field("e-handler","מטפל",r.handler,"text",{list:"dl-handler"}));
  g2.appendChild(field("e-title","כותרת תרומה",r.title,"text",{list:"dl-title"}));sh.appendChild(g2);
  var g3=el("div","grid2");g3.appendChild(field("e-monthly","סכום חודשי ₪",r.monthly||"","number"));g3.appendChild(field("e-months","מספר חודשים",r.months||"","number"));sh.appendChild(g3);
  sh.appendChild(field("e-total","סכום כולל ₪",r.total||"","number"));
  sh.appendChild(field("e-method","אופן התרומה",r.method,"text"));
  sh.appendChild(field("e-ded","הקדשת יום",r.dedication,"text"));
  sh.appendChild(field("e-notes","הערות",r.notes,"textarea"));
  [["dl-handler",uniq("handler")],["dl-title",uniq("title")]].forEach(function(p){var d=el("datalist");d.id=p[0];p[1].forEach(function(v){var o=el("option");o.value=v;d.appendChild(o)});sh.appendChild(d)});
  sh.addEventListener("input",function(e){if(e.target.id==="e-monthly"||e.target.id==="e-months"){var m=num($("#e-monthly").value),n=num($("#e-months").value);if(m&&n)$("#e-total").value=m*n}});
  var bt=el("div","sheetbtns");
  var cancel=el("button","btn","ביטול");cancel.type="button";cancel.onclick=close;
  var save=el("button","btn primary",isNew?"הוספה":"שמירה");save.type="button";
  if(readOnly){save.disabled=true;sh.appendChild(el("div","ro","לחשבון הזה אין הרשאת כתיבה בגיליון, לכן אפשר רק לצפות."))}
  function done(msg){toast(msg);close();loadAll(false)}
  function fail(e){
    if(e&&e.stale){toast("השורה שונתה בגיליון בינתיים. הנתונים רועננו, נסו שוב.");close();loadAll(false);return}
    save.disabled=false;var m=writeErr(e);toast(m);
    if(readOnly){save.disabled=true}}
  save.onclick=function(){
    var d={first:$("#e-first").value.trim(),last:$("#e-last").value.trim(),phone:$("#e-phone").value.trim(),status:$("#e-status").value,
      handler:$("#e-handler").value.trim(),title:$("#e-title").value.trim(),monthly:num($("#e-monthly").value),months:num($("#e-months").value),
      total:num($("#e-total").value),method:$("#e-method").value.trim(),dedication:$("#e-ded").value.trim(),notes:$("#e-notes").value.trim()};
    if(!d.first&&!d.last){toast("צריך להזין לפחות שם אחד");return}
    save.disabled=true;
    writeDonor(isNew?null:r,d).then(function(){done(isNew?"התורם נוסף לגיליון":"נשמר בגיליון")}).catch(fail)};
  bt.appendChild(cancel);bt.appendChild(save);
  if(!isNew){
    var del=el("button","btn danger full","מחיקת תורם");del.type="button";var armed=false;
    if(readOnly)del.disabled=true;
    del.onclick=function(){
      if(!armed){armed=true;del.classList.add("armed");del.textContent="לחצו שוב כדי למחוק מהגיליון";setTimeout(function(){armed=false;del.classList.remove("armed");del.textContent="מחיקת תורם"},4000);return}
      del.disabled=true;
      clearDonor(r).then(function(){done("השורה נוקתה בגיליון")}).catch(function(e){del.disabled=false;fail(e)})};
    bt.appendChild(del)}
  sh.appendChild(bt);scrim.appendChild(sh);layer.appendChild(scrim);
  document.addEventListener("keydown",esc);
  function esc(e){if(e.key==="Escape")close()}
  function close(){layer.textContent="";document.removeEventListener("keydown",esc);if(!$("#app").hidden)render()}
  setTimeout(function(){var f=$("#e-first");if(f&&isNew)f.focus()},50)}

/* ============ ייצוא ============ */
function exportCsv(){
  var head=["שם פרטי","שם משפחה","טלפון","כותרת תרומה","סכום חודשי","מספר חודשים","סכום כולל","הקדשת יום","אופן התרומה","סטטוס","מטפל","הערות"];
  var keys=["first","last","phone","title","monthly","months","total","dedication","method","status","handler","notes"];
  function q(v){v=v==null?"":String(v);return '"'+v.replace(/"/g,'""')+'"'}
  var lines=[head.map(q).join(",")];
  rows.slice().sort(function(a,b){return a.ord-b.ord}).forEach(function(r){lines.push(keys.map(function(k){return q(r[k])}).join(","))});
  var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="תורמים-בדינר.csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}

/* ============ מעטפת ============ */
function go(tab){st.tab=tab;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===st.tab?"true":"false")});
  $("#fab").hidden=readOnly;
  renderKpis();
  var host=$("#view");host.textContent="";
  if(st.tab==="sum")renderSummary(host);else renderList(host)}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){go(b.dataset.tab)}});
$("#fab").onclick=function(){openEditor(null)};
$("#signout").onclick=signOut;

/* ה-Client ID נקרא ממשתנה הסביבה GOOGLE_CLIENT_ID דרך /api/config. אם אין, נשאר הערך שבהגדרות למעלה. */
fetch("/api/config",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.clientId)CFG.CLIENT_ID=j.clientId}).catch(function(){}).then(function(){
  var err=urlError();
  if(err){showGate({error:err});return}
  fetchToken().then(function(){return loadAll(true)}).catch(function(e){
    if(e&&e.auth)showGate();
    else showGate({error:"אי אפשר להתחבר לשרת כרגע. נסו שוב בעוד רגע."})})});
})();
